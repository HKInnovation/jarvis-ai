<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S.</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

  <div class="app">

    <aside class="sidebar">
      <div class="brand">
        <div class="core">
          <div class="core-ring r1"></div>
          <div class="core-ring r2"></div>
          <div class="core-dot"></div>
        </div>
        <h1>J.A.R.V.I.S.</h1>
        <span class="subtitle">Personal AI Assistant</span>
      </div>

      <div class="status-panel">
        <div class="status-row">
          <span class="dot online"></span> Backend <span class="value">Online</span>
        </div>
        <div class="status-row">
          <span class="dot online"></span> Model <span class="value">Llama 4</span>
        </div>
        <div class="status-row">
          <span class="dot" id="wakeStatusDot"></span> Wake Word <span class="value" id="wakeStatusText">Off</span>
        </div>
      </div>

      <div class="quick-actions">
        <p class="section-label">Quick Ask</p>
        <button class="chip" data-prompt="What's the weather in Chennai?">🌤 Weather</button>
        <button class="chip" data-prompt="Give me the latest news">📰 News</button>
        <button class="chip" data-prompt="Who is Albert Einstein?">📖 Wikipedia</button>
        <button class="chip" data-prompt="generate an image of a futuristic city">🎨 Generate Image</button>
        <button class="chip" data-prompt="generate a video of ocean waves">🎬 Generate Video</button>
        <button class="chip" data-prompt="Open notepad">💻 Open App</button>
      </div>

      <div class="section-label" style="margin-top:20px;">Language</div>
      <select id="languageSelect" class="lang-selector" style="width:100%; margin-top:8px;">
        <option value="en">🇬🇧 English</option>
        <option value="ta">🇮🇳 Tamil</option>
        <option value="hi">🇮🇳 Hindi</option>
        <option value="te">🇮🇳 Telugu</option>
        <option value="ml">🇮🇳 Malayalam</option>
        <option value="fr">🇫🇷 French</option>
        <option value="de">🇩🇪 German</option>
        <option value="es">🇪🇸 Spanish</option>
        <option value="ja">🇯🇵 Japanese</option>
        <option value="zh">🇨🇳 Chinese</option>
      </select>

      <div class="section-label" style="margin-top:20px;">Wake Word</div>
      <button id="wakeToggleBtn" class="chip" style="width:100%; margin-top:8px; text-align:center;">
        🎙 Enable "Hey JARVIS"
      </button>

      <div class="sidebar-footer">
        <button id="clearBtn" class="ghost-btn">🗑 Clear Chat</button>
      </div>
    </aside>

    <main class="chat-panel">

      <header class="chat-header">
        <div>
          <h2>Conversation</h2>
          <span class="header-sub">Ask anything — text, voice, files, images</span>
        </div>
        <div class="header-actions">
          <span id="connStatus" class="conn-badge">● Connected</span>
        </div>
      </header>

      <div id="chatBox" class="chat-box"></div>

      <div id="typingIndicator" class="typing-indicator" style="display:none;">
        <div class="avatar jarvis-avatar">J</div>
        <div class="bubble typing-bubble">
          <span></span><span></span><span></span>
        </div>
      </div>

      <div id="dropZone" class="drop-zone" style="display:none;">
        <p>📂 Drop file or image here to analyze</p>
      </div>

      <div id="filePreview" class="file-preview" style="display:none;"></div>

      <div class="input-bar">
        <input type="file" id="fileInput" accept=".png,.jpg,.jpeg,.webp,.gif,.pdf,.docx,.txt" hidden>
        <button id="attachBtn" class="icon-btn" title="Attach file or image">📎</button>
        <input type="text" id="userInput" placeholder="Message JARVIS..." autocomplete="off">
        <button id="micBtn" class="icon-btn" title="Voice input">🎤</button>
        <button id="sendBtn" class="send-btn" title="Send">➤</button>
      </div>
    </main>

  </div>

  <!-- Wake word indicator -->
  <div id="wakeIndicator" class="wake-indicator">
    <div class="wake-dot"></div>
    <span id="wakeIndicatorText">Listening for "Hey JARVIS"...</span>
  </div>

  <script src="/static/script.js"></script>
</body>
</html>
